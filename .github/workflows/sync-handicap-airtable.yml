name: Sync handicap runs from Airtable

# ChatGPT cannot write to GitHub: the App exposes write-shaped tools but every branch/file write returns
# 403 "Resource not accessible by integration". It CAN write to Airtable. So ChatGPT posts one row per
# handicap run to the `Sports Betting Bridge` base and this workflow carries it into `handicap-data`:
#
#   ChatGPT -> Airtable row (READY_FOR_SYNC) -> validate -> immutable JSON -> push -> row becomes SYNCED
#
# Nothing here WRITES to `main`'s data, `market-data`, the collectors, or any model. It moves already-made
# decisions from an inbox into the ledger, and refuses anything it cannot prove is a valid, new, prospective
# recommendation batch -- for a real bet, that proof is an authenticated pre-trade approval, which is why
# this job needs the signing key and not only the Airtable token.
#
# It does READ `market-data`, and must: a real recommendation is checked against the freshest CONFIRMED
# executable quote before it becomes canonical, and that quote lives in the capture stream. Without the
# checkout there is no evidence, and no evidence fails the gate closed -- so the sync refuses to start
# rather than importing real recommendations unverified. See docs/DECISION_STANDARD.md.

on:
  # Twice a day, September through February -- the NFL season plus the playoffs. The bridge ARCHIVES
  # decisions that were already made and already approved, so ingestion latency costs the audit trail
  # nothing: neither clock it relies on is read from this run.
  #
  #   REQUEST provenance  = Airtable's server-side createdTime, stamped when ChatGPT writes the row. It
  #                         proves the candidate request existed by then, and it is what preflight expiry
  #                         is measured from.
  #   DECISION provenance = the signed `approval_as_of` in `Preflight Result`, which is also the
  #                         `created_at` on every record in `Approved Payload`. It proves WHEN the bet was
  #                         approved, at prices confirmed then.
  #
  # A row's createdTime is NOT the prospective timestamp of the recommendation it carries; that is the
  # signed approval instant, minutes later. Polling faster would buy latency we have no use for and spend
  # Airtable free-tier quota we do.
  #
  # An idle poll costs exactly one request, so this is ~60 requests/month in season and none out of it,
  # leaving the bulk of the allowance for ChatGPT's own writes, status updates, retries and E2E testing.
  # Need it sooner? Use workflow_dispatch -- that is what it is for.
  schedule:
    - cron: '23 */12 * 9-12,1-2 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'validate pending rows only: write nothing, change no Airtable status'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# Two importers pushing handicap-data at once could interleave a batch. Queue instead of cancelling: a
# cancelled run that had already pushed would leave its Airtable rows READY_FOR_SYNC and re-import on the
# next run, which is safe but wasteful, and cancelling mid-push is the one moment worth not being in.
concurrency:
  group: nfl-airtable-handicap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Importer code and the ledger are separate checkouts so no step ever switches branch under the other.
      # workspace/code   = main (this branch's importer)
      # workspace/ledger = handicap-data (the immutable record)
      - name: Checkout importer code (main)
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout ledger (handicap-data)
        uses: actions/checkout@v4
        with:
          ref: handicap-data
          path: ledger
          # Full history: the push rebases onto origin/handicap-data if another writer got there first, and
          # a shallow checkout cannot. The branch is a few hundred small JSON files.
          fetch-depth: 0

      # READ-ONLY. The decision-time price gate resolves the freshest confirmed executable quote from the
      # capture stream. depth 1 is enough and is what keeps this cheap: the gate reads the newest manifests,
      # state.json and quote files, never the history.
      - name: Checkout market data (market-data)
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No install step. The importer is stdlib-only (urllib, json, hashlib) precisely so this workflow has
      # no dependency surface and cannot fail on a package resolution before it ever reaches Airtable.

      - name: Git identity for the ledger
        working-directory: ledger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check the Airtable secret is configured
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          if [ -z "${AIRTABLE_TOKEN}" ]; then
            echo "::error::AIRTABLE_TOKEN is not configured for this repository."
            echo "Create a scoped Airtable personal access token (data.records:read + data.records:write,"
            echo "limited to the Sports Betting Bridge base) and add it under"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "See docs/AIRTABLE_BRIDGE.md. Never paste the token into an issue, a log or a PR."
            exit 1
          fi
          echo "AIRTABLE_TOKEN is present (value never printed)."
      # WARNS, never exits. Unlike the token above, this secret is not a prerequisite for the JOB: a
      # PASS/WATCHLIST-only row needs no authenticated approval and must still be archived. Exiting here
      # would stop the importer before it ran, so the per-row disposition it implements -- defer the real
      # recommendation, import the passes -- would never happen, and the job would look like a hard failure
      # when the correct outcome is "some work done, one thing to fix".
      #
      # scripts/handicap/sync_airtable.py is the authority. It resolves the key from its own environment and
      # decides per row: a real approved recommendation is deferred (READY_FOR_SYNC, exit 2), a PASS
      # imports, badly signed data is still ERROR. The preflight WORKER keeps a hard check, because it can
      # issue nothing at all without a key.
      - name: Check the approval signing secret is configured
        env:
          PREFLIGHT_SIGNING_KEY: ${{ secrets.PREFLIGHT_SIGNING_KEY }}
        run: |
          if [ -z "${PREFLIGHT_SIGNING_KEY}" ]; then
            echo "::warning::PREFLIGHT_SIGNING_KEY is not configured; rows carrying a real RECOMMENDED"
            echo "record will be DEFERRED (left READY_FOR_SYNC, never ERROR, nothing written) and the run"
            echo "will exit 2. PASS/WATCHLIST rows still import."
            echo "A pre-trade approval is authenticated, not merely self-consistent. Generate one strong"
            echo "random key (e.g. openssl rand -hex 32) and add it under Settings -> Secrets and variables"
            echo "-> Actions. It must never be stored in Airtable, the Automation, ChatGPT or this repo."
          else
            echo "PREFLIGHT_SIGNING_KEY is present (value never printed)."
          fi

      - name: Sync pending handicap runs
        working-directory: code
        env:
          # BOTH secrets have to be declared HERE. A step's `env:` is scoped to that step and nothing else,
          # so the two checks above prove only that the secrets EXIST -- they do not put either into this
          # process. The importer read AIRTABLE_TOKEN and PREFLIGHT_SIGNING_KEY from its own environment,
          # and with the signing key missing it could not authenticate an approval it had just been handed:
          # a correctly signed, gate-passing recommendation would be refused because the RUNNER was wired
          # wrong. Proving a secret exists is not the same as passing it.
          #
          # Both are passed through the environment, never on a command line (argv is world-readable on the
          # runner), never echoed, and never written to disk.
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          PREFLIGHT_SIGNING_KEY: ${{ secrets.PREFLIGHT_SIGNING_KEY }}
        run: |
          python3 scripts/handicap/sync_airtable.py \
            --handicap-root ../ledger \
            --market-data ../market-data \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Ledger state after sync
        if: always()
        working-directory: ledger
        run: |
          # `set -eo pipefail` is on, and `find` exits 1 on a directory that does not exist yet (no batch has
          # ever been bridged). Guard both so a summary step can never fail the run.
          echo "recommendations on handicap-data: $( { find data/recommendations -name '*.json' 2>/dev/null || true; } | wc -l)"
          echo "import receipts:                  $( { find data/import_receipts  -name '*.json' 2>/dev/null || true; } | wc -l)"
          echo "decision gate records:            $( { find data/decision_gates   -name '*.json' 2>/dev/null || true; } | wc -l)"
          git log --oneline -3

      # The append-only property is what makes this branch evidence. write_record enforces it in the
      # application and a server-side ruleset should prevent a bypass (docs/OPERATIONS.md), but neither is
      # visible from here -- so the history is checked directly, every run, right after we wrote to it.
      - name: Verify the ledger history is still append-only
        if: always()
        working-directory: code
        run: python3 scripts/handicap/verify_append_only.py --handicap-root ../ledger
