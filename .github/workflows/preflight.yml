name: Pre-trade preflight

# THE PRE-TRADE LEG. Event-driven, and deliberately not on a schedule.
#
# ChatGPT produces the candidate and can write Airtable; it cannot run a script, clone a branch, or dispatch
# a workflow. It CAN open a GitHub issue, so that is the doorbell:
#
#   ChatGPT writes a PREFLIGHT_REQUESTED row
#     -> ChatGPT opens a `PREFLIGHT NFL` issue in this repository                (the free trigger)
#     -> this job checks out main, the ledger, and the tiny evidence branch
#     -> scripts/handicap/preflight_airtable.py fetches THIS candidate's live market + depth-10 book,
#        publishes that evidence append-only, and runs the SAME gates the ledger will later replay
#     -> the row becomes PREFLIGHT_APPROVED or PREFLIGHT_BLOCKED, verdict in `Preflight Result`
#     -> ChatGPT reads it; ONLY APPROVED may be surfaced as a BET
#
# WHY EVENT-DRIVEN AND NOT A CRON. A confirmed executable quote is fresh for fifteen minutes and the owner
# needs the answer before it goes stale. Polling for that would also spend the Airtable free-tier allowance
# the twelve-hourly archival importer depends on. The two legs have different jobs and different cadences:
# this one is immediate safety, `sync-handicap-airtable` is archival transport and stays twelve-hourly.
#
# WHY AN ISSUE. Airtable's free tier has no "Run script" Automation action, so the paid path that used to
# start this workflow is not available. ChatGPT's GitHub integration can open an issue but cannot dispatch a
# workflow. So an issue is used as a TRIGGER SIGNAL and nothing else: it carries no candidate, no ticker, no
# thesis, no probability, no price, no stake and no Airtable content. Airtable remains the transport and the
# only place the verdict lives. Nothing in the issue -- title beyond the prefix, body, labels -- is read as
# input, so a trigger cannot influence what the worker decides, only that it runs.
#
# WHY THIS JOB NO LONGER CHECKS OUT market-data. On 2026-09-13 it did, to look up ONE ticker in the capture
# stream: the fetch ran ~57s and writing ~17,491 files ran another ~43s, so the worker started ~101s into the
# run and answered a 17:00:00Z kickoff at 17:01:30Z. The live path now asks the venue about that one contract
# directly (two public GETs) and keeps the evidence on an append-only branch. `market-data` is still read --
# SPARSELY, for `data/kalshi/fees/` alone, which is a handful of small JSON files.
#
# WHAT IT WRITES. One Airtable field plus a status, and append-only public market evidence on
# `preflight-evidence`. It never writes a ledger branch: a preflight verdict is not a record, and the record
# is filed later through the normal bridge.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'compute verdicts and print them; change no Airtable row'
        type: boolean
        required: false
        default: false
  # Kept as a debugging fallback for anything holding a token that would rather POST /dispatches. The
  # operating trigger is the issue below, which needs no token at all -- see docs/AIRTABLE_BRIDGE.md.
  repository_dispatch:
    types: [preflight]
  # The free trigger. This repository is PUBLIC, so anyone can open an issue: the job-level `if` below is
  # the security boundary, and it is what stops an arbitrary user from making the real Airtable worker run.
  #
  # `edited` is here because of the 2026-09-13 incident. The owner opened `PREFLIGHT NFL`, the guard wanted
  # `[PREFLIGHT NFL]`, and the job was SKIPPED -- correctly silent, because silence is what protects the
  # boundary from strangers, and therefore invisible to the owner, who waited and then dispatched by hand
  # into a run that answered after kickoff. Fixing the title must be able to ring the doorbell. It widens
  # nothing: `issue.user.login` is the issue's AUTHOR, not whoever edited it, and only the owner or a
  # collaborator can edit a title at all.
  issues:
    types: [opened, edited]
  # THE NORMAL OPERATING TRIGGER. ChatGPT can write Airtable and can comment on GitHub; it cannot dispatch a
  # workflow or run a script. So once it has written the candidate rows it rings a doorbell by commenting on
  # ONE designated pull request, and the worker wakes immediately -- no issue to file, no button to press.
  #
  # WHY NOT A SCHEDULE. A five-minute poll spends one Airtable request per wake-up whether or not anything
  # is waiting: ~6,500 a month against a Free workspace allowance of 1,000, and even a fifteen-minute poll
  # exceeds it. A doorbell costs ZERO when idle, so Airtable usage tracks actual requests rather than
  # elapsed clock time. That is the only shape that fits in the allowance, and it is also faster.
  #
  # `issue_comment` covers pull-request conversation comments as well as issue comments, which is why the
  # guard below has to establish that the object really is a pull request and really is the doorbell.
  issue_comment:
    types: [created]

# Read-only on this repository's code. `contents: write` exists for ONE purpose: publishing append-only
# public market evidence to the `preflight-evidence` branch, which is what makes an approval replayable after
# the runner is gone. `nfl_edge/handicap/evidence_store.py` refuses to publish to any other branch, so this
# grant cannot reach main, market-data or handicap-data.
# `issues: write` exists for exactly one purpose: closing (and commenting once on) the trigger issue after
# the attempt. This job cannot start workflows and cannot touch a pull request.
permissions:
  contents: write
  issues: write

# Serialise: two runs answering the same row would each compute a verdict and the later write would win.
# Do NOT cancel in progress -- a cancelled run leaves the row PREFLIGHT_REQUESTED, which is correctly "not
# approved", but wastes the fifteen minutes of quote freshness the owner is waiting on.
concurrency:
  group: nfl-preflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  preflight:
    # AN ALLOWLIST, NOT A DENYLIST. A trigger this expression does not name cannot start the worker, so a
    # future `on:` entry added without thinking about authorisation is inert rather than open. For the issue
    # trigger both conditions must hold: the author is the repository owner, and the title carries one of the
    # accepted prefixes. The owner check is the security control; the prefix is routing, so an ordinary bug
    # report from the owner does not spend a preflight run.
    #
    # BOTH title forms are accepted. `[PREFLIGHT NFL]` is the documented convention; `PREFLIGHT NFL` is what
    # a human types in a hurry, which is the only time this doorbell is ever rung. Relaxing routing costs an
    # attacker nothing -- an outsider with a perfect title is still refused -- and tightening it cost a
    # kickoff. `nfl_edge/handicap/preflight_trigger.py` is the same rule as a function, and
    # tests/test_preflight_issue_trigger.py evaluates THIS expression and asserts the two agree.
    #
    # A job that is skipped here never starts, so an outsider's issue costs nothing, reveals nothing and is
    # not touched: no run, no comment, no close.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.number == 18 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, 'PREFLIGHT NFL')) ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[PREFLIGHT NFL]') ||
        startsWith(github.event.issue.title, 'PREFLIGHT NFL')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark the start of the run
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout preflight code (main)
        uses: actions/checkout@v4
        with:
          path: code
          fetch-depth: 1

      # READ-ONLY and SPARSE. The fee-schedule gate wants the append-only fee observations, and nothing else
      # on this branch is on the live decision path any more. `sparse-checkout` with cone mode off fetches
      # blobs for these paths only, so this step costs a fraction of a second instead of the ~100s the full
      # branch cost on 2026-09-13. The capture stream is deliberately NOT here.
      - name: Checkout fee observations only (market-data, sparse)
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: fees
          fetch-depth: 1
          sparse-checkout: |
            data/kalshi/fees
          sparse-checkout-cone-mode: false

      # READ-ONLY. Outstanding portfolio exposure is read from the committed ledger, so the caps bind
      # cumulatively rather than resetting for every candidate batch. An unreadable ledger blocks.
      - name: Checkout ledger (handicap-data)
        uses: actions/checkout@v4
        with:
          ref: handicap-data
          path: ledger
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No install step: the pre-trade path is stdlib-only on purpose, so this workflow cannot fail on a
      # package resolution before it ever reaches a gate.

      - name: Check the Airtable secret is configured
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          if [ -z "${AIRTABLE_TOKEN}" ]; then
            echo "::error::AIRTABLE_TOKEN is not configured for this repository."
            echo "See docs/AIRTABLE_BRIDGE.md. Never paste the token into an issue, a log or a PR."
            exit 1
          fi
          echo "AIRTABLE_TOKEN is present (value never printed)."
      - name: Check the approval signing secret is configured
        env:
          PREFLIGHT_SIGNING_KEY: ${{ secrets.PREFLIGHT_SIGNING_KEY }}
        run: |
          if [ -z "${PREFLIGHT_SIGNING_KEY}" ]; then
            echo "::error::PREFLIGHT_SIGNING_KEY is not configured for this repository."
            echo "A pre-trade approval is authenticated, not merely self-consistent. Generate one strong"
            echo "random key (e.g. openssl rand -hex 32) and add it under Settings -> Secrets and variables"
            echo "-> Actions. It must never be stored in Airtable, a trigger issue, ChatGPT or this repo."
            exit 1
          fi
          echo "PREFLIGHT_SIGNING_KEY is present (value never printed)."

      - name: Identify the evidence publisher
        working-directory: code
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Answer pending preflight requests
        working-directory: code
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          # Authenticates the pre-trade approval. It exists ONLY here: never in Airtable, never in a
          # trigger issue, never in ChatGPT, never in this repository. Without it the worker will not issue
          # an approval and the importer will not archive a real recommendation.
          PREFLIGHT_SIGNING_KEY: ${{ secrets.PREFLIGHT_SIGNING_KEY }}
          PREFLIGHT_TRIGGER: ${{ github.event_name }}
        run: |
          python3 scripts/handicap/preflight_airtable.py \
            --handicap-root ../ledger \
            --fee-observations ../fees \
            --started-at-epoch "${{ steps.t0.outputs.epoch }}" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--no-write --no-evidence-push' || '' }}

      # Cleanup runs on `always()` so a failed worker still closes its trigger. The comment is deliberately
      # contentless: it names the Actions run and nothing else. It must never carry the verdict, a candidate,
      # a ticker, a price, a probability, a stake or a thesis -- the Airtable row is the only place the
      # answer lives, and "the issue closed" is never evidence that anything was approved.
      - name: Close the trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="Preflight workflow completed. See the Actions run: ${RUN_URL}"
          BODY="${BODY} -- this issue was a trigger only. The verdict is in the Airtable row, which is"
          BODY="${BODY} authoritative; a closed issue is not an approval."
          gh issue close "$ISSUE" --comment "$BODY" \
            || echo "::warning::could not close trigger issue #${ISSUE}; it carries no data, so a stale open trigger is harmless"
