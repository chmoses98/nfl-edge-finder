name: Shadow Pricing (full universe)

# Prices every supported Kalshi NFL market at the latest capture snapshot and appends immutable observations
# to the shadow ledger on the `market-data` branch. Research only: nothing is selected, nothing is recommended.

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      model_version:
        description: 'model version string recorded on every row'
        required: false
        default: 'shadow-0.2.0'

permissions:
  contents: write

concurrency:
  group: shadow-price
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q numpy pandas polars scipy pyarrow
      - name: Fetch bronze inputs (nflverse) and market-data
        run: |
          python3 scripts/data/nflverse_download.py --only pbp,pbp_participation,schedules,stats_player,snap_counts,players,rosters,weekly_rosters,injuries --seasons 2013-2026 2>&1 | tail -3
          python3 nfl_edge/data/silver.py 2016 2025 2>&1 | tail -2
          python3 nfl_edge/data/ids.py 2>&1 | tail -3
          git fetch --depth=1 origin market-data
          rm -rf /tmp/md && git worktree add -f /tmp/md origin/market-data
      - name: Rebuild Kalshi player map from the latest discovery
        run: |
          D=$(ls -d /tmp/md/data/kalshi/discovery/*/ | tail -1)
          python3 scripts/shadow/rebuild_opportunity.py 2>&1 | tail -2
          python3 scripts/kalshi/build_player_map.py --discovery-dir "$D" --season 2026 2>&1 | tail -6
      - name: Price the slate
        id: price
        run: |
          python3 scripts/shadow/price_slate.py --market-data /tmp/md \
            ${{ github.event.inputs.model_version && format('--model-version {0}', github.event.inputs.model_version) || '' }} \
            --out data/shadow/ledger 2>&1 | tail -25
      - name: Ingest live information shocks
        run: |
          python3 scripts/shadow/ingest_shocks.py --md /tmp/md --out /tmp/md/data/shocks 2>&1 | tail -3
      - name: Publish shocks
        run: |
          python3 scripts/ci/publish_market_data.py --src data/shocks --message "shocks $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "::warning::shock publish failed"
      - name: System health
        run: |
          python3 scripts/shadow/system_health.py --md /tmp/md 2>&1 | tail -30
      - name: Publish ledger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_market_data.py --src data/shadow/ledger --message "shadow ledger $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
