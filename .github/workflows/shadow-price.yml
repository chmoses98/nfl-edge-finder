name: Shadow Pricing (full universe)

# Prices every supported Kalshi NFL market at the latest capture snapshot and appends immutable observations
# to the shadow ledger on the `market-data` branch. Research only: nothing is selected, nothing is recommended.

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      model_version:
        description: 'model version string recorded on every row (blank = pricer default)'
        required: false
        default: ''

permissions:
  contents: write

# Every step here pipes python into `tail` for readable logs. Without pipefail bash reports the exit status
# of `tail`, which always succeeds, so a script that died returned 0 and the step went green. Run 37 passed
# all eleven steps in 2m22s having priced nothing.
defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: shadow-price
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q numpy pandas polars scipy pyarrow
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch bronze inputs (nflverse) and market-data
        run: |
          python3 scripts/data/nflverse_download.py --only pbp,pbp_participation,schedules,stats_player,snap_counts,players,rosters,weekly_rosters,injuries,ff_playerids --seasons 2013-2026 2>&1 | tail -3
          python3 nfl_edge/data/silver.py 2016 2025 2>&1 | tail -2
          python3 nfl_edge/data/ids.py 2>&1 | tail -3
          git fetch --depth=1 origin market-data
          rm -rf /tmp/md && git worktree add -f /tmp/md origin/market-data
      - name: Rebuild Kalshi player map from the latest discovery
        run: |
          D=$(ls -d /tmp/md/data/kalshi/discovery/*/ | tail -1)
          python3 scripts/shadow/rebuild_opportunity.py 2>&1 | tail -2
          python3 scripts/kalshi/build_player_map.py --discovery-dir "$D" --season 2026 2>&1 | tail -6
      - name: Price the slate
        id: price
        run: |
          python3 scripts/shadow/price_slate.py --market-data /tmp/md \
            ${{ github.event.inputs.model_version && format('--model-version {0}', github.event.inputs.model_version) || '' }} \
            --out data/shadow/ledger 2>&1 | tail -25
      - name: Ingest live information shocks
        run: |
          python3 scripts/shadow/ingest_shocks.py --md /tmp/md --out /tmp/md/data/shocks 2>&1 | tail -3
      - name: Publish shocks
        run: |
          python3 scripts/ci/publish_market_data.py --src data/shocks --message "shocks $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: System health
        run: |
          python3 scripts/shadow/system_health.py --md /tmp/md 2>&1 | tail -30
      - name: Publish ledger
        run: |
          python3 scripts/ci/publish_market_data.py --src data/shadow/ledger --message "shadow ledger $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # ---- handicap report -------------------------------------------------------------------------
      # This job has already paid for everything a report needs: the nflverse bronze inputs, the silver
      # tables, the identity crosswalk, the newest capture and -- as of the step above -- the newest priced
      # ledger. Building the packet here costs seconds; a separate 2-hourly workflow would repeat a
      # 20-minute download to reach the same state. So during the season the handicap report simply
      # refreshes with every pricing cycle.
      #
      # Nothing below can fail the pricing job: the ledger is the product here, and it is already
      # published. A report failure is reported and the previous good `latest/` stays up with its own
      # timestamp.
      - name: Make the ledger just written visible to the packet builder
        id: freshledger
        continue-on-error: true
        run: |
          for d in data/shadow/ledger/*/; do
            [ -d "$d" ] || continue
            mkdir -p "/tmp/md/data/shadow/ledger/$(basename "$d")"
            cp "$d"* "/tmp/md/data/shadow/ledger/$(basename "$d")/"
          done
          ls -1 /tmp/md/data/shadow/ledger/*/*.ledger_manifest.json | tail -2

      - name: Resolve the active season/week
        id: week
        continue-on-error: true
        run: |
          python3 scripts/handicap/resolve_active_week.py --market-data /tmp/md \
            --allow-no-slate --github-output "$GITHUB_OUTPUT"

      - name: Prove the report path cannot reach Airtable
        if: steps.week.outputs.status == 'OK'
        continue-on-error: true
        run: python3 scripts/ci/assert_no_airtable.py

      - name: Build the handicap packet from this cycle's ledger
        id: report
        if: steps.week.outputs.status == 'OK'
        continue-on-error: true
        run: |
          python3 scripts/handicap/build_report.py --market-data /tmp/md \
            --out data/handicap_report \
            --season ${{ steps.week.outputs.season }} --week ${{ steps.week.outputs.week }} \
            --trigger shadow-cycle --max-ledger-age-min 45 \
            --artifact-name 'run-nfl-${{ steps.week.outputs.season }}-w${{ steps.week.outputs.week_padded }}-${{ github.run_id }}'

      - name: Upload the report artifact
        if: steps.report.outputs.report_status == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: run-nfl-${{ steps.week.outputs.season }}-w${{ steps.week.outputs.week_padded }}-${{ github.run_id }}
          path: data/handicap_report
          retention-days: 90
          if-no-files-found: error

      - name: Publish the browsable latest report
        if: steps.report.outputs.report_status == 'SUCCESS'
        continue-on-error: true
        run: |
          python3 scripts/ci/publish_handicap_report.py --src data/handicap_report \
            --message "run nfl ${{ steps.week.outputs.season }} week ${{ steps.week.outputs.week }} — packet ${{ steps.report.outputs.packet_sha }} (shadow cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ'))"

      - name: Report outcome
        if: always()
        run: |
          echo "handicap report: ${{ steps.report.outputs.report_status || 'SKIPPED' }} (${{ steps.week.outputs.status || 'no week' }})"
          if [ "${{ steps.week.outputs.status }}" != "OK" ]; then
            echo "::notice::no active NFL slate: ${{ steps.week.outputs.reason }}"
          elif [ "${{ steps.report.outputs.report_status }}" != "SUCCESS" ]; then
            echo "::warning::handicap report did not build this cycle; the previous latest/ report stands with its own timestamp"
          fi
