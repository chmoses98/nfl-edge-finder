name: Shadow v2 projections (full board)

# SHADOW / RESEARCH ONLY. Projects EVERY captured Kalshi NFL contract at the latest capture snapshot through
# the engine its question names (game, period, joint, season, three player arms) and appends immutable
# ProjectionRecords to data/shadow/v2/projections on `market-data`. Nothing here selects, recommends, gates or
# reaches the recommendation path; the incumbent shadow ledger is neither read nor written.
#
# INERT UNTIL MERGED: schedules only fire from the default branch, and the job is additionally guarded so a
# dispatch from a feature branch does nothing. docs/SHADOW_V2.md.

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: shadow-v2-project
  cancel-in-progress: false

jobs:
  project:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q numpy pandas polars scipy pyarrow
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # The period engine's residual bank is fitted on play-by-play quarter scores 2012-2025 (cached as a silver
      # table after the first build); the player engine on player statistics and snap counts 2013-2025.
      - name: Fetch bronze inputs (nflverse) and market-data
        run: |
          python3 scripts/data/nflverse_download.py --only pbp,schedules,stats_player,snap_counts,players,rosters,weekly_rosters,injuries,ff_playerids --seasons 2012-2026 2>&1 | tail -3
          python3 nfl_edge/data/silver.py 2012 2025 2>&1 | tail -2
          python3 nfl_edge/data/ids.py 2>&1 | tail -3
          git fetch --depth=1 origin market-data
          rm -rf /tmp/md && git worktree add -f /tmp/md origin/market-data
      - name: Rebuild Kalshi player map from the latest discovery
        run: |
          D=$(ls -d /tmp/md/data/kalshi/discovery/*/ | tail -1)
          python3 scripts/kalshi/build_player_map.py --discovery-dir "$D" --season 2026 2>&1 | tail -6
      - name: Project the whole board
        id: project
        run: |
          python3 scripts/shadow_v2/project_slate_v2.py --market-data /tmp/md --out data --target-season 2026 2>&1 | tail -40
      - name: Verify before anything is published
        run: |
          python3 scripts/shadow_v2/verify_projections.py --root data/shadow/v2/projections --require-rows
      - name: Publish the immutable projection records and the run summary
        run: |
          python3 scripts/ci/publish_market_data.py --src data/shadow/v2 \
            --message "shadow v2 projections $(ls data/shadow/v2/runs/*.summary.json | tail -1 | xargs -n1 basename | cut -d. -f1)"
