name: Kalshi legacy tape manifest (research-only, read-only, additive)

# One-off / on-demand: exact line count, bytes, sha256, time span and candle presence of every LEGACY tape (data/kalshi/backfill/trades/**), published as
# data/kalshi/backfill/legacy_manifest.json on market-data (new path only; trades/ and candles/ are never modified). It is the immutable "before" baseline for
# the tape-recovery coverage report and the priority list (tapes capped at exactly 10,000 prints first) for kalshi-tape-repair.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data-backfill
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch the legacy tapes into a SEPARATE scratch repo (never sparse-checkout the main working tree) and list candle files
        run: |
          set -e
          mkdir -p /tmp/md && cd /tmp/md
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git sparse-checkout init --no-cone
          git sparse-checkout set /data/kalshi/backfill/trades/
          git fetch -q --depth=1 --filter=blob:none origin market-data
          git checkout -q FETCH_HEAD
          # candle presence only needs the file NAMES: empty placeholders from the tree listing instead of downloading ~430 MB
          git ls-tree -r --name-only FETCH_HEAD data/kalshi/backfill/candles | while read -r f; do mkdir -p "$(dirname "$f")"; : > "$f"; done
          du -sh data/kalshi/backfill/trades; find data/kalshi/backfill/candles -type f | wc -l
      - name: Build manifest
        run: python3 scripts/kalshi/legacy_manifest.py --backfill /tmp/md/data/kalshi/backfill --out data/kalshi/backfill/legacy_manifest.json
      - name: Publish (new path only)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ls data/kalshi/backfill
          python3 scripts/ci/publish_market_data.py --src data/kalshi/backfill --sparse --only legacy_manifest.json --message "legacy tape manifest $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
