name: Workflow health (run outcomes)

# Names what actually happened to every run of the last 48 hours: SUCCESS, FAILED_BY_CODE, PUBLICATION_FAILED,
# TIMED_OUT, CANCELLED_BY_CONCURRENCY or EXTERNALLY_CANCELLED (scripts/ops/workflow_outcomes.py). GitHub reports a
# job timeout, a superseded pending run and an explicit cancel all as "cancelled"; on 2026-09-22 telling them apart
# took an hour of log reading. The table is written to the run summary and the JSON is kept on market-data.
# Read-only against the Actions API; it changes no workflow and cancels nothing.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # write, not read: a DEAD conductor chain is restarted once below (a workflow_dispatch; the chain's concurrency
  # group collapses any surplus). Everything else here only reads the Actions API.
  actions: write

concurrency:
  group: workflow-health
  cancel-in-progress: true

jobs:
  outcomes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 45, not 15: every publish below checks out the whole market-data tree (~70k files; ~11 min the first time,
    # ~3 min after). Runs 94, 95, 97 and 98 (2026-10-05/06) hit the 15-minute limit inside a publish, so the
    # conductor-chain alarm and the red Wave-2 / horizon miss steps never ran. Ops plumbing only.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Classify every recent run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ops/workflow_outcomes.py --repo "${{ github.repository }}" --hours 48 --out data/ops/workflow_outcomes
      - name: Keep the classification on market-data
        continue-on-error: true
        run: python3 scripts/ci/publish_market_data.py --src data/ops/workflow_outcomes --message "workflow outcomes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # HORIZON CAPTURE HEALTH, season to date, split BEFORE / AFTER the horizon conductor. Weeks 1-2's misses are
      # permanent history and stay visible; the AFTER_CONDUCTOR row is the health of the current system. The
      # step goes RED when a horizon owed under the conductor was missed in the last 48 hours -- the failure is
      # published first, so the evidence exists even though the run is red.
      - name: Horizon capture health (RUN NFL + three-arm)
        id: capture_health
        continue-on-error: true
        run: |
          git fetch --depth=1 origin handicap-reports || true
          git show origin/handicap-reports:state/horizons.json > /tmp/run_nfl_state.json 2>/dev/null || echo '{}' > /tmp/run_nfl_state.json
          git fetch --depth=1 --filter=blob:none origin market-data || true
          mkdir -p /tmp/ta && for f in $(git ls-tree --name-only origin/market-data data/shadow/arms/horizons/ 2>/dev/null); do
            git show "origin/market-data:${f}" > "/tmp/ta/$(basename "${f}")" || true
          done
          python3 scripts/handicap/horizon_capture_health.py --run-nfl-state /tmp/run_nfl_state.json \
            --three-arm-markers-dir /tmp/ta --out data/ops/capture_health --fail-on-recent-miss-hours 48 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the capture health on market-data
        continue-on-error: true
        run: python3 scripts/ci/publish_market_data.py --src data/ops/capture_health --message "horizon capture health $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # WAVE-2 COLLECTION HEALTH (GAME SCRIPT V2 research evidence, RESEARCH_ONLY). Every EARLY / LATE window the
      # schedule owes since wave2-research.yml reached main is CAPTURED, INVALID (malformed, incoherent arm, stale
      # components hash, post-kickoff, dry-run, wrong schema), WRITE_ONCE_COLLISION or MISSED, and every finished
      # post-cutoff game has (or lacks) a pre-kickoff GAME SCRIPT V2 capture with world fingerprints for RISK1. Missing
      # evidence is red here instead of silently absent. Reads predictions only: no outcome, no score, no metric.
      - name: Wave-2 collection health
        id: wave2_health
        continue-on-error: true
        shell: bash -eo pipefail {0}
        run: |
          git fetch --depth=1 --filter=blob:none origin market-data || true
          python3 scripts/sim/wave2_collection_health.py --market-data-ref origin/market-data --out data/ops/wave2_collection \
            --fail-on-recent-miss-hours 48 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the Wave-2 collection health on market-data
        continue-on-error: true
        run: python3 scripts/ci/publish_market_data.py --src data/ops/wave2_collection --message "wave2 collection health $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # DEAD-CHAIN ALARM. The conductors keep themselves alive by dispatching their successor, with an hourly cron as
      # a backstop on the same unreliable scheduler. A dead chain is red here (and restarted once) instead of being
      # discovered by a missed horizon or a capture gap. The router's conductor is watched read-only and never red.
      - name: Conductor chains alive
        id: chains
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ops/conductor_health.py --workflow horizon-conductor.yml --workflow kalshi-conductor.yml \
            --optional chmoses98/kalshi-bet-router:router-conductor.yml --restart --summary "$GITHUB_STEP_SUMMARY"
      - name: A conductor chain is dead
        if: steps.chains.outcome == 'failure'
        run: |
          echo "::error::A self-chaining conductor had no link queued or running. It was re-dispatched once; see the table above."
          exit 1
      - name: Wave-2 research evidence was missed or invalid
        if: steps.wave2_health.outcome == 'failure'
        run: |
          echo "::error::A Wave-2 capture window owed in the last 48h was MISSED / INVALID, or a RISK1 script capture is missing. See the Wave-2 collection health above."
          exit 1
      - name: A horizon owed under the conductor was missed
        if: steps.capture_health.outcome == 'failure'
        run: |
          echo "::error::A decision horizon owed under the horizon conductor was MISSED in the last 48h. See the capture health above."
          exit 1
