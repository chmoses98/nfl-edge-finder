name: Probe Free Sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-write
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/data/probe_sources.py
      - name: Publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_market_data.py --src data/kalshi/probes --message "source probes $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
