name: Wave-2 research capture (RESEARCH_ONLY)

# GAME SCRIPT V2 -- WAVE 2 prospective evidence (research/game_script_v2/wave2/PROSPECTIVE_PROTOCOL.md).
# For each game kicking off in a capture window (EARLY: 90-240 min before kickoff, LATE: 30-90 min), simulate the
# incumbent and the Wave-2 candidate arms (S1, Q1, A1, M1) on identical rows and publish ONE write-once record per game
# and window to market-data under data/research/wave2/. Zero authority: nothing here is read by pricing, the ledger,
# the packet's decision fields, gates, preflight, risk or staking. A failure here cannot affect any other workflow.
#
# Cheap first: the schedule and a blob-less listing of market-data decide whether any game is due; the nflverse
# download and the full market-data checkout only happen when one is.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      rehearsal_cutoff:
        description: >-
          REHEARSAL ONLY (blank = normal capture). An ISO instant inside some post-cutoff game's EARLY / LATE window:
          the full download -> simulate -> write path runs at that cutoff into a scratch directory as dry_run records,
          a second attempt proves the (game, window) is refused, and NOTHING is published.
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: wave2-research
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q numpy pandas polars scipy pyarrow
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Is any game due? (schedule + record index only)
        id: due
        if: inputs.rehearsal_cutoff == ''
        run: |
          python3 scripts/data/nflverse_download.py --only schedules --seasons 2026-2026 2>&1 | tail -1
          git fetch --depth=1 --filter=blob:none origin market-data
          python3 scripts/sim/wave2_prospective.py --check-only --existing-from-git origin/market-data --github-output "$GITHUB_OUTPUT"
      - name: Fetch bronze inputs (nflverse) and market-data
        if: steps.due.outputs.due == 'true' || inputs.rehearsal_cutoff != ''
        run: |
          python3 scripts/data/nflverse_download.py --only pbp,schedules,stats_player,snap_counts,players,rosters,weekly_rosters,injuries,depth_charts,ff_playerids --seasons 2016-2026 2>&1 | tail -3
          python3 nfl_edge/data/silver.py 2016 2026 2>&1 | tail -2
          python3 nfl_edge/data/ids.py 2>&1 | tail -3
          git fetch --depth=1 origin market-data
          rm -rf /tmp/md && git worktree add -f /tmp/md origin/market-data
      - name: Capture (incumbent and candidate arms, identical rows)
        id: capture
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          PYTHONHASHSEED: '0'
        run: |
          python3 scripts/sim/wave2_prospective.py --market-data /tmp/md --existing-from-git origin/market-data --out . 2>&1 | tail -20
      - name: Publish the write-once records
        if: steps.due.outputs.due == 'true' && steps.capture.outcome == 'success' && hashFiles('data/research/wave2/**') != ''
        continue-on-error: true
        run: |
          python3 scripts/ci/publish_market_data.py --src data/research/wave2 --message "wave2 research capture $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      # REHEARSAL (workflow_dispatch with rehearsal_cutoff): proves the capture path in this exact environment before a
      # real window, without creating evidence. Records are dry_run (the scorer refuses them), live only in /tmp, and
      # are uploaded as a run artifact for inspection. The second attempt must find nothing due for the same window.
      - name: Rehearsal capture (dry run, never published)
        if: inputs.rehearsal_cutoff != ''
        env:
          PYTHONHASHSEED: '0'
        run: |
          python3 scripts/sim/wave2_prospective.py --market-data /tmp/md --cutoff "${{ inputs.rehearsal_cutoff }}" \
            --out /tmp/rehearsal --dry-run 2>&1 | tail -5
          ls -l /tmp/rehearsal/data/research/wave2/*/ | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/sim/wave2_prospective.py --market-data /tmp/md --cutoff "${{ inputs.rehearsal_cutoff }}" \
            --out /tmp/rehearsal --dry-run 2>&1 | tail -2 | tee /tmp/second.txt
          grep -q "due: none" /tmp/second.txt && echo "write-once: the second attempt found nothing due (refused)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/sim/wave2_collection_health.py --validate-dir /tmp/rehearsal --rehearsal | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the rehearsal records as an artifact
        if: inputs.rehearsal_cutoff != ''
        uses: actions/upload-artifact@v4
        with:
          name: wave2-rehearsal
          path: /tmp/rehearsal/data/research/wave2
          retention-days: 7
