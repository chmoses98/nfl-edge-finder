name: Disagreement Diagnosis (projection accuracy + validated-signal contract)

# After settlement, scores the frozen pre-kickoff projections against settled outcomes and the contemporaneous Kalshi
# quote, classifies every model-market disagreement segment as MODEL_ERROR / VALIDATED_SIGNAL / UNRESOLVED with the rules
# in chmoses98/sift-sports-intelligence research/intelligence, and publishes `sift.disagreement_status.v1` to
# market-data under data/intelligence/nfl/ for SIFT to read. RESEARCH ONLY: nothing here reaches the pricer, the gates,
# the risk policy, the preflight or staking, and the contract says so (authority RESEARCH_ONLY).
#
# INERT UNTIL MERGED: schedules fire from the default branch only. Disk discipline: market-data is fetched BLOBLESS and only
# data/shadow/evaluations/ is checked out (~120 MB), never the whole branch.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      intelligence_ref:
        description: 'ref of chmoses98/sift-sports-intelligence holding research/intelligence'
        required: false
        default: 'main'

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: disagreement-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # a feature-branch dispatch must not publish
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: chmoses98/sift-sports-intelligence
          ref: ${{ github.event.inputs.intelligence_ref || 'main' }}
          path: sift
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q numpy pandas
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch settled evaluations (sparse, blobless)
        run: |
          git fetch --depth=1 --filter=blob:none origin market-data
          rm -rf /tmp/md && git worktree add --no-checkout -f /tmp/md origin/market-data
          git -C /tmp/md sparse-checkout init --no-cone
          git -C /tmp/md sparse-checkout set '/data/shadow/evaluations/' '/data/shadow/evaluations_challenger/'
          git -C /tmp/md checkout -q
          ls /tmp/md/data/shadow/evaluations | wc -l
      - name: Diagnose
        id: diag
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p data/intelligence/nfl
          cd sift
          # Paired challenger / incumbent / market scoring on identical observations. Insufficient evidence (no challenger
          # evaluations yet) is a normal, honest output - it never fails the job and never fabricates a comparison.
          mkdir -p /tmp/md/data/shadow/evaluations_challenger
          python3 -m research.intelligence.paired_arms /tmp/md/data/shadow/evaluations /tmp/md/data/shadow/evaluations_challenger \
            ../data/intelligence/nfl/$TS.paired_arms.json || echo '{"status":"INSUFFICIENT_EVIDENCE"}' > ../data/intelligence/nfl/$TS.paired_arms.json
          python3 -m research.intelligence.nfl_prospective /tmp/md/data/shadow/evaluations \
            ../data/intelligence/nfl/$TS.diagnosis.json ../data/intelligence/nfl/$TS.disagreement_status.v1.json \
            ../data/intelligence/nfl/$TS.paired_arms.json
          cd ..
          # Idempotence: an unchanged result (same contract apart from its timestamp) publishes nothing, so repeated runs
          # never accumulate duplicate records.
          python3 - "$TS" <<'PY'
          import json, subprocess, sys, os
          ts = sys.argv[1]
          new = json.load(open(f"data/intelligence/nfl/{ts}.disagreement_status.v1.json"))
          try:
              old = json.loads(subprocess.check_output(["git", "show", "origin/market-data:data/intelligence/nfl/latest.json"], stderr=subprocess.DEVNULL))
          except Exception:
              old = None
          strip = lambda c: {k: v for k, v in c.items() if k != "generated_at"} if c else None
          if strip(old) == strip(new):
              print("unchanged since the last publication; nothing to publish")
              for f in os.listdir("data/intelligence/nfl"):
                  os.remove(os.path.join("data/intelligence/nfl", f))
          else:
              json.dump(new, open("data/intelligence/nfl/latest.json", "w"), indent=1)
          PY
          python3 - <<'PY'
          import json,glob
          fs = sorted(glob.glob("data/intelligence/nfl/*.disagreement_status.v1.json"))
          if fs:
              c=json.load(open(fs[-1]))
              print(c["message"]); print(c["betting_signals"]["status_counts"], c["sample_accounting"]["independent_player_stat_games"], "independent units")
          PY
      - name: Publish (derived, rebuildable; timestamped files are never rewritten)
        run: |
          [ -n "$(ls -A data/intelligence/nfl 2>/dev/null)" ] || { echo "nothing new"; exit 0; }
          python3 scripts/ci/publish_market_data.py --src data/intelligence --message "disagreement diagnosis $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
