name: NFL PIT availability capture watchdog

# GitHub cron is best-effort (2026-10-12: Monday 21:47 / 22:47 UTC capture slots never ran, 23:47 ran 2h56m late).
# This watchdog is a second, independently scheduled path: if the latest capture slot has NO PUBLISHED capture and the
# slot's purpose is still alive (pregame roster slots 60 min, report-day slots 180 min), it dispatches the existing
# capture workflow, the same `gh workflow run` pattern the conductors use. Research only.
#
# What it does NOT do: backfill (a capture is stamped with our real retrieval time; a closed window stays a gap in
# pit-availability-health), certify availability, or write evidence itself (it only dispatches; the capture workflow's
# write-once store checks and "Slot gate" still apply). Idempotent: it does nothing while a capture run is queued or
# running, a duplicate queued behind a successful one is skipped by the capture workflow's gate, and it dispatches at
# most 3 times per slot (publication failures), after which the slot stays a visible gap.
on:
  schedule:
    # 20 / 35 / 50 min after the :47 pregame slots (Sun 11:47-23:47, Mon / Thu 21:47-23:47) and after the :17 report-day
    # slots (Wed-Sat 02:17 08:17 14:17 20:17, plus a 110-min look). Off-:00 minutes on purpose.
    - cron: '37,52 2,8,14,20 * * 3,4,5,6'
    - cron: '7 3,4,9,10,15,16,21,22 * * 3,4,5,6'
    - cron: '7,22,37 12-23 * * 0'
    - cron: '7,22,37 22,23 * * 1,4'
    - cron: '7,22,37 0 * * 1,2,5'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pit-availability-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decide (published store + capture run history)
        id: decide
        run: |
          bash scripts/pit_availability/checkout_store.sh /tmp/pit_md
          gh run list --workflow pit-availability-nfl.yml --branch main --limit 100 \
            --json event,conclusion,status,createdAt,updatedAt,displayTitle > /tmp/pit_runs.json
          python3 scripts/ops/pit_availability_health.py --mode watchdog --store /tmp/pit_md/data/pit_availability/nfl \
            --runs-json /tmp/pit_runs.json --summary "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Dispatch the capture workflow for the dropped slot
        if: steps.decide.outputs.action == 'DISPATCH'
        run: gh workflow run pit-availability-nfl.yml --ref main -f reason="watchdog:${SLOT}" && echo "dispatched for ${SLOT}"
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ steps.decide.outputs.slot }}
