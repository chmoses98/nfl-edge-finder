name: Shadow v2 settlement & scorecard

# Settles every frozen shadow-v2 projection of every proven-FINAL game from nflverse (finals + postgame tables,
# play-by-play quarter scores for period markets), appends ONE write-once settlement batch per game to
# data/shadow/v2/settlements on `market-data`, diagnoses the DATA arm (autopsy v2) and rebuilds the universal
# scorecard from the whole corpus. The projections are read and never written. Games not yet proven final are
# deferred, never guessed. docs/SHADOW_V2.md.
#
# SHADOW / RESEARCH ONLY. INERT UNTIL MERGED (schedule from the default branch only; job guarded).

on:
  schedule:
    - cron: '49 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: shadow-v2-settle
  cancel-in-progress: false

jobs:
  settle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The three drivers stream every game from its own projection files and re-read the whole settlement corpus
    # for the scorecard; that is bounded in memory but grows in time with the season. 45 minutes was sized for a
    # run that never got past its fetch step.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q numpy pandas polars scipy pyarrow
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # `rosters` is not optional: ids.py builds the crosswalk from players + rosters + ff_playerids and
      # refuses (RosterSourceMissing) when no roster_<season>.parquet was downloaded. Omitting it here is
      # what killed the first manual run with polars' bare "cannot concat empty list".
      - name: Fetch results (schedule, player statistics, snap counts, play-by-play, identities) and market-data
        run: |
          python3 scripts/data/nflverse_download.py --only schedules,stats_player,snap_counts,pbp,players,rosters,ff_playerids --seasons 2025-2026 2>&1 | tail -4
          python3 nfl_edge/data/ids.py 2>&1 | tail -3
          git fetch --depth=1 origin market-data
          rm -rf /tmp/md && git worktree add -f /tmp/md origin/market-data
      # Live logs, not `| tail -N`: the first settlement run died with the runner's shutdown signal after 17 minutes
      # and the log held nothing, because tail prints only once the process exits. Each driver's full output is
      # kept under $RUNNER_TEMP and its tail is shown on failure so a dead step still says where it died.
      - name: Settle every ready game, diagnose, rebuild the scorecard
        id: settle
        run: |
          python3 scripts/shadow_v2/settle_v2.py --market-data /tmp/md --out data/shadow/v2 --target-season 2026 \
            --github-output "$GITHUB_OUTPUT" 2>&1 | tee "$RUNNER_TEMP/settle_v2.log"
      # Canonical close + CLV for every kicked-off game (Parts 2-6): write-once batches per game; a game without a
      # valid pre-kickoff observation is CLV_CLOSE_MISSING, never inferred.
      - name: Pair every kicked-off projection with its canonical close and compute CLV
        id: closes
        run: |
          python3 scripts/shadow_v2/pair_closes_v2.py --market-data /tmp/md --out data/shadow/v2 --github-output "$GITHUB_OUTPUT" 2>&1 | tee "$RUNNER_TEMP/pair_closes_v2.log"
      # THE IMMUTABLE EVIDENCE IS PUBLISHED BEFORE THE DERIVED REBUILD, not with it. The settlement, close and
      # CLV batches are write-once evidence that costs forty minutes of settlement to produce; the research
      # export is derived, rebuildable, the slowest thing in the job, and the part that grows fastest with the
      # corpus. Publishing them in one commit meant the derived half could take the evidence down with it, and
      # it did: run 35681158381 settled all fourteen week-2 Sunday games, then had the whole push rejected
      # because that run's `2026_wk02.research.jsonl.gz` had reached 160.92 MB against GitHub's 100 MB file
      # limit. Two publishes, evidence first, is the same rule the research step's `continue-on-error` already
      # states for the case where it fails outright -- now it holds for running long or pushing too big as well.
      - name: Publish the settlement, close and CLV batches, autopsies and scorecard
        id: publish_evidence
        if: steps.settle.outputs.status == 'WROTE' || steps.closes.outputs.status == 'WROTE' || steps.settle.outputs.index_written != '0'
        run: |
          python3 scripts/ci/publish_market_data.py --src data/shadow/v2 \
            --message "shadow v2 settlements ${{ steps.settle.outputs.batch_id }} (${{ steps.settle.outputs.written }} records) + closes ${{ steps.closes.outputs.written }}"
      # Derived, rebuildable research table + scorecard v3 + weekly report + health gate. Failure here must not
      # block publishing the immutable batches above.
      - name: Rebuild the research export, scorecard v3, weekly report and health gate
        id: research
        continue-on-error: true
        run: |
          WEEK=$(python3 scripts/shadow_v2/active_week.py --market-data /tmp/md)
          echo "active week: $WEEK"
          python3 scripts/shadow_v2/research_export_v2.py --market-data /tmp/md --staging data/shadow/v2 --out data/shadow/v2/research --season 2026 --week "$WEEK" 2>&1 | tee "$RUNNER_TEMP/research_export_v2.log"
          python3 scripts/shadow_v2/weekly_report_v2.py --market-data /tmp/md --research data/shadow/v2/research --out data/shadow/v2/reports --season 2026 --week "$WEEK" 2>&1 | tee "$RUNNER_TEMP/weekly_report_v2.log"
          # fail-soft: a failed eligibility build must never cost the week its research publication
          python3 scripts/shadow_v2/eligibility_v2.py --reports data/shadow/v2/reports --market-data /tmp/md --out data/shadow/v2/eligibility 2>&1 | tee "$RUNNER_TEMP/eligibility_v2.log" || echo "::warning::production-eligibility build failed; the previous latest.json stays in force"
      - name: Show where a failed driver died
        if: failure() || steps.research.outcome == 'failure'
        run: |
          for f in settle_v2 pair_closes_v2 research_export_v2 weekly_report_v2 eligibility_v2; do
            if [ -f "$RUNNER_TEMP/$f.log" ]; then echo "::group::$f (last 60 lines)"; tail -60 "$RUNNER_TEMP/$f.log"; echo "::endgroup::"; fi
          done
      # The derived half, in its own commit. The projection index (data/shadow/v2/projection_index, one JSON per
      # immutable projection file) rides with whichever publish runs first, so the next run reuses it instead of
      # re-indexing the archive. A no-op when the rebuild changed nothing.
      - name: Publish the research export, scorecard v3 and weekly report
        if: steps.research.outcome == 'success'
        run: |
          python3 scripts/ci/publish_market_data.py --src data/shadow/v2 \
            --message "shadow v2 research export + scorecard + weekly report (batch ${{ steps.settle.outputs.batch_id }})"
