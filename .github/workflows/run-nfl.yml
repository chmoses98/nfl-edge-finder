name: RUN NFL

# Builds the canonical handicap packet -- slate.md, packet.json, games/<game_id>.md -- for the active NFL
# slate, uploads it as an artifact and replaces the browsable report at `handicap-reports/latest/`.
#
# RESEARCH ONLY. This workflow creates no bets, no recommendations and no preflight requests, needs no
# secrets at all, and never contacts Airtable -- a static audit of the whole import graph runs as its first
# step and fails the run before anything is built if that ever stops being true. Real money begins later, in
# `preflight.yml`, and only when a candidate is deliberately promoted.
#
# Actions -> RUN NFL -> Run workflow, with every input blank, is the intended experience: the season and
# week come from the schedule, not from whoever remembers what week it is.

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'season (blank = resolve from the schedule)'
        required: false
        type: string
        default: ''
      week:
        description: 'week (blank = resolve from the schedule)'
        required: false
        type: string
        default: ''
      game_id:
        description: 'a game to surface in the summary, e.g. 2026_01_NE_SEA (the full slate is built either way)'
        required: false
        type: string
        default: ''
      force_fresh:
        description: 'capture fresh context and price a fresh LOCAL shadow snapshot before building'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      season:
        required: false
        type: string
        default: ''
      week:
        required: false
        type: string
        default: ''
      game_id:
        required: false
        type: string
        default: ''
      force_fresh:
        required: false
        type: boolean
        default: true
      trigger:
        description: 'what caused this run (manual / horizon / shadow-cycle)'
        required: false
        type: string
        default: 'manual'
      horizon_ids:
        description: 'comma-separated decision horizons this run satisfies, marked captured on success'
        required: false
        type: string
        default: ''
      max_ledger_age_min:
        description: 'refuse to build from a ledger older than this (blank = no limit)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Every step pipes python into `tail` for readable logs. Without pipefail bash reports tail's status, which
# always succeeds -- shadow-price.yml run 37 went green having priced nothing that way.
defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: run-nfl
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # RUN NFL's contract is "current production main + current market-data". A plain checkout builds
      # whatever ref the dispatch was launched from, so a report from an experimental branch would be
      # indistinguishable from a canonical one -- same artifact name, same latest/, same manifest. The ref
      # is pinned, and the resolved sha is recorded in the manifest as `sources.main_sha`. Code under
      # development is still exercised normally by `tests.yml`, which checks out the PR head.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm this is canonical main
        run: |
          echo "building RUN NFL from main @ $(git rev-parse HEAD)"
          git rev-parse --abbrev-ref HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Runs before anything is downloaded or built: if the report path can reach Airtable, preflight or
      # the recommendation writer, the run stops here rather than proving it afterwards.
      - name: Prove the report path cannot reach Airtable
        run: python3 scripts/ci/assert_no_airtable.py

      # CONCURRENT CONTEXT CAPTURE. The capture (~4.5-6 min, mostly sequential weather calls) reads nothing from
      # market-data except data/context/state.json, its change-suppression cache, yet it used to wait for the ~5
      # minute market-data fetch. It now starts here, with state.json read ahead of the tree, and runs while the
      # dependencies install and the nflverse inputs and market-data download. The step below that used to run it
      # WAITS for it, proves it had the same state.json the fetched tree holds, and otherwise re-runs it
      # sequentially exactly as before (scripts/handicap/concurrent_context.py). Nothing here can fail the run.
      - name: Start the fresh context capture concurrently
        if: inputs.force_fresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ctx data/context
          if gh api -H "Accept: application/vnd.github.raw" \
               "repos/${{ github.repository }}/contents/data/context/state.json?ref=market-data" > /tmp/ctx/state.used.json 2>/tmp/ctx/state.err; then
            echo "context state read ahead of the market-data tree"
          else
            echo "::notice::state.json not read ahead of the tree; the capture is re-run sequentially if the tree disagrees"
            echo '{}' > /tmp/ctx/state.used.json
          fi
          cp /tmp/ctx/state.used.json data/context/state.json
          python3 scripts/handicap/concurrent_context.py start --dir /tmp/ctx

      - name: Install
        run: pip install -q numpy pandas polars scipy pyarrow

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Same inputs the 2-hourly shadow-pricing job builds, because the packet's team and quarterback
      # profiles read the same silver tables and play-by-play.
      - name: Fetch bronze inputs (nflverse) and market-data
        run: |
          python3 scripts/data/nflverse_download.py --only pbp,pbp_participation,schedules,stats_player,snap_counts,players,rosters,weekly_rosters,injuries,depth_charts,ff_playerids --seasons 2013-2026 2>&1 | tail -3
          # THROUGH THE CURRENT SEASON. The packet's team form and adjusted ratings read team_game_<season>, and
          # build_profiles uses only games strictly before the target week, so the current season's completed
          # weeks are admissible -- and without them the packet reported 2025 as "current form" in week 3.
          python3 nfl_edge/data/silver.py 2016 2026 2>&1 | tail -2
          python3 nfl_edge/data/ids.py 2>&1 | tail -3
          git fetch --depth=1 origin market-data
          rm -rf /tmp/md && git worktree add -f /tmp/md origin/market-data

      - name: Resolve the active season/week
        id: week
        run: |
          python3 scripts/handicap/resolve_active_week.py \
            --market-data /tmp/md \
            --pin-season '${{ inputs.season }}' --pin-week '${{ inputs.week }}' \
            --allow-no-slate --github-output "$GITHUB_OUTPUT"

      - name: No active slate — stop without publishing
        if: steps.week.outputs.status != 'OK'
        run: |
          echo "## RUN NFL — SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.week.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was published. Any existing \`handicap-reports/latest/\` keeps its own timestamp." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::no active slate: ${{ steps.week.outputs.reason }}"

      # ---- fresh path ---------------------------------------------------------------------------
      # A manual research report must not package a two-hour-old ledger and call it current. These three
      # steps rebuild the state the packet is made of, LOCALLY: the canonical shadow ledger on market-data
      # is written by the scheduled pricing job and is not duplicated merely because somebody asked a
      # question.
      - name: Rebuild Kalshi player map from the latest discovery
        if: steps.week.outputs.status == 'OK' && inputs.force_fresh
        run: |
          D=$(ls -d /tmp/md/data/kalshi/discovery/*/ | tail -1)
          python3 scripts/shadow/rebuild_opportunity.py 2>&1 | tail -2
          python3 scripts/kalshi/build_player_map.py --discovery-dir "$D" --season ${{ steps.week.outputs.season }} 2>&1 | tail -6

      # NOT continue-on-error. A force_fresh run whose context capture dies must not fall back to older
      # published weather/injuries, build happily, replace latest/ and mark a decision horizon captured. At
      # T-30m that is the difference between having the inactive release and silently predating it.
      # context_capture.py exits 2 when any source failed closed, so a partial capture fails the step.
      - name: Capture fresh weather / injuries / availability
        if: steps.week.outputs.status == 'OK' && inputs.force_fresh
        id: context
        run: |
          mkdir -p data/context
          # Normally already done: started concurrently above. 0 = finished with the same state.json this tree
          # holds; 3/4 = state differed / never started / hung -> run it sequentially, exactly as before; any other
          # code is the capture's own failure and fails the run, as before.
          BG=0
          python3 scripts/handicap/concurrent_context.py wait --dir /tmp/ctx \
            --tree-state /tmp/md/data/context/state.json --timeout-min 20 || BG=$?
          if [ "$BG" -eq 3 ] || [ "$BG" -eq 4 ]; then
            echo "running the context capture sequentially (concurrent result $BG)"
            find data/context -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
            cp /tmp/md/data/context/state.json data/context/state.json 2>/dev/null || echo '{}' > data/context/state.json
            python3 scripts/data/context_capture.py 2>&1 | tail -5
          elif [ "$BG" -ne 0 ]; then
            echo "::error::the fresh context capture failed (exit $BG)"
            exit "$BG"
          fi
          # The fresh capture is used locally by this report. It is not published: a research question
          # should not add rows to the canonical context stream, and the packet still diffs against the
          # newest PUBLISHED capture, which is already in /tmp/md.
          for d in data/context/*/; do
            [ -d "$d" ] || continue
            mkdir -p "/tmp/md/data/context/$(basename "$d")"
            cp -n "$d"* "/tmp/md/data/context/$(basename "$d")/" || true
          done
          # The run id this capture produced. The build proves the packet actually read it; the capture is
          # change-suppressed, so the manifest -- which is always written -- is the honest marker, never a
          # timestamp stamped onto somebody else's file.
          RID=$(ls -1 data/context/*/*.manifest.json | tail -1 | xargs -n1 basename | cut -d. -f1)
          if [ -z "$RID" ]; then echo "::error::context capture wrote no manifest"; exit 1; fi
          echo "context_run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "fresh context capture: $RID"

      # REFRESH, THEN FREEZE. market-data was fetched ~5-10 minutes ago, at the start of the job, and the Kalshi
      # conductor publishes a capture every ~15 minutes. Pricing whatever was fetched then, and gating its age at
      # build time ~11 minutes later, measured our own runtime as market staleness: on 2026-09-26 the T-24h builds
      # passed the 30m gate at 22.0 and 26.5 minutes, and a capture that had landed on schedule could be refused
      # -- at T-30m that is a MISSED horizon, with no time left to retry. So the tree is brought up to the newest
      # published capture immediately before pricing (an incremental shallow fetch: about a second), and that
      # instant is recorded as the freeze the capture gate measures against. The build-time age is still
      # recorded beside it. A refresh that fails leaves the tree as fetched and says so; the gate still decides.
      # Which simulation run existed when this job first fetched market-data -- recorded so the manifest can show
      # whether the one finally attached is different (the TNF T-30 packet attached a run 327 minutes behind its
      # ledger; a newer one had landed four minutes after the clone).
      - name: Record the simulation present at checkout
        id: sim_initial
        if: steps.week.outputs.status == 'OK'
        continue-on-error: true
        run: |
          RID=$(ls /tmp/md/data/shadow/sim/*/*.projections.jsonl.gz 2>/dev/null | xargs -r -n1 basename | sort | tail -1 | cut -c1-16)
          echo "initial simulation run: ${RID:-none}"
          echo "run_id=${RID}" >> "$GITHUB_OUTPUT"

      - name: Refresh market-data and freeze the pricing inputs
        id: freeze
        if: steps.week.outputs.status == 'OK' && inputs.force_fresh
        run: |
          FROM=$(git -C /tmp/md rev-parse --short=12 HEAD)
          if git fetch --depth=1 origin market-data 2>&1 | tail -2 && git -C /tmp/md checkout -q --detach origin/market-data; then
            echo "market-data refreshed before pricing: ${FROM} -> $(git -C /tmp/md rev-parse --short=12 HEAD)"
          else
            echo "::warning::could not refresh market-data before pricing; pricing from the tree fetched at the start (${FROM})"
          fi
          ls -1 /tmp/md/data/kalshi/capture/*/*.manifest.json 2>/dev/null | tail -1 | xargs -r -n1 basename || true
          echo "frozen_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Fresh LOCAL shadow-pricing snapshot
        if: steps.week.outputs.status == 'OK' && inputs.force_fresh
        run: |
          python3 scripts/shadow/price_slate.py --market-data /tmp/md \
            --target-season ${{ steps.week.outputs.season }} \
            --out data/shadow/ledger 2>&1 | tail -25
          # Make the snapshot we just priced the one the packet builder sees, without publishing it to the
          # canonical ledger. Local-only freshness, canonical history untouched.
          for d in data/shadow/ledger/*/; do
            [ -d "$d" ] || continue
            mkdir -p "/tmp/md/data/shadow/ledger/$(basename "$d")"
            cp "$d"* "/tmp/md/data/shadow/ledger/$(basename "$d")/"
          done

      # FROZEN-BUNDLE SIMULATION. The coherent player simulation is re-run HERE, from the inputs this build froze:
      # the ledger just priced (market at the freeze), the fresh context capture (Sleeper availability), the
      # injury vintage and depth chart resolved at or before --cutoff, and play-by-play history of games complete
      # before it. --cutoff is the freeze instant, so no input after the horizon can enter. Operational instance
      # only: written to this checkout (origin RUN_NFL_FROZEN_BUNDLE), never published, never overwriting the
      # research stream. PYTHONHASHSEED=0 makes a replay of the same bundle bit-identical (the engine seeds its
      # own RNG; string-hash order was the only other source of variation). ~60 s for a full slate. If it fails,
      # the packet attaches the newest ELIGIBLE published run and the freshness gate says how stale it is.
      - name: Fresh LOCAL coherent simulation from the frozen bundle
        if: steps.week.outputs.status == 'OK' && inputs.force_fresh && steps.freeze.outputs.frozen_at != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONHASHSEED: '0'
        run: |
          S=${{ steps.week.outputs.season }}
          python3 scripts/sim/project_week.py --market-data /tmp/md --out . \
            --season "$S" --week ${{ steps.week.outputs.week }} \
            --cutoff '${{ steps.freeze.outputs.frozen_at }}' --origin RUN_NFL_FROZEN_BUNDLE \
            --bundle "research/simulation_engine/bundle_${S}.json" 2>&1 | tail -12

      # ---- build ---------------------------------------------------------------------------------
      - name: Build the handicap packet
        id: build
        if: steps.week.outputs.status == 'OK'
        run: |
          # A run that says force_fresh has just priced a local snapshot; if the copy into /tmp/md silently
          # matched nothing, the packet would quietly build from the older PUBLISHED ledger and still be
          # labelled fresh. An age limit turns that into a failure instead of a lie. 45m matches the
          # shadow-pricing cycle's own limit.
          AGE='${{ inputs.max_ledger_age_min }}'
          if [ -z "$AGE" ] && [ '${{ inputs.force_fresh }}' = 'true' ]; then AGE=45; fi
          LIMIT=""
          if [ -n "$AGE" ]; then LIMIT="--max-ledger-age-min $AGE"; fi
          # A fresh ledger is not a fresh market: price_slate prices the newest capture it can find, so a
          # ledger written a minute ago can quote a Kalshi poll from an hour ago. Gate the capture the
          # ledger was actually PRICED FROM, and require this run's own context capture to be the one the
          # packet read.
          if [ '${{ inputs.force_fresh }}' = 'true' ]; then
            LIMIT="$LIMIT --max-capture-age-min 30"
            # Measured at the freeze above, not at build time; build_report records both ages.
            if [ -n '${{ steps.freeze.outputs.frozen_at }}' ]; then
              LIMIT="$LIMIT --capture-age-reference ${{ steps.freeze.outputs.frozen_at }}"
            fi
            LIMIT="$LIMIT --require-context-run-id ${{ steps.context.outputs.context_run_id }}"
          fi
          python3 scripts/handicap/build_report.py \
            --market-data /tmp/md \
            --out data/handicap_report \
            --season ${{ steps.week.outputs.season }} --week ${{ steps.week.outputs.week }} \
            --trigger '${{ inputs.trigger || 'manual' }}' \
            --horizon-ids '${{ inputs.horizon_ids }}' \
            --focus-game-id '${{ inputs.game_id }}' \
            --artifact-name 'run-nfl-${{ steps.week.outputs.season }}-w${{ steps.week.outputs.week_padded }}-${{ github.run_id }}' \
            --initial-sim-run-id '${{ steps.sim_initial.outputs.run_id }}' \
            $LIMIT

      # Immutable history lives here, not on the report branch: one artifact per run, traceable through its
      # manifest to the workflow run, both source SHAs, the model version and the packet SHA.
      - name: Upload the report artifact
        if: steps.build.outputs.report_status == 'SUCCESS'
        uses: actions/upload-artifact@v4
        with:
          name: run-nfl-${{ steps.week.outputs.season }}-w${{ steps.week.outputs.week_padded }}-${{ github.run_id }}
          path: data/handicap_report
          retention-days: 90
          if-no-files-found: error

      - name: Mark the decision horizons captured
        if: steps.build.outputs.report_status == 'SUCCESS' && inputs.horizon_ids != ''
        run: |
          mkdir -p /tmp/hz
          git fetch --depth=1 origin handicap-reports || true
          git show origin/handicap-reports:state/horizons.json > /tmp/hz/in.json 2>/dev/null || echo '{}' > /tmp/hz/in.json
          python3 scripts/handicap/mark_horizons.py --state /tmp/hz/in.json --out /tmp/hz/horizons.json \
            --horizon-ids '${{ inputs.horizon_ids }}' --run-id '${{ github.run_id }}' \
            --manifest data/handicap_report/manifest.json

      # ---- Edge Finder app payload (docs/APP_EXPORT.md) --------------------------------------------
      # A pure adapter over the report just built plus a READ-ONLY extract of the handicap-data ledger
      # (git archive into RUNNER_TEMP; no worktree, no push, nothing written back). The ledger is read so
      # the app can show the owner's recorded decisions, wagers and settlements beside the model board; no
      # recommendation is created here, and the report path itself still never imports the ledger reader.
      #
      # continue-on-error so a failed export can never block the report publish that follows it; the
      # exporter leaves a health.json (export_failed) beside the previous good payload, which the publish
      # carries onto the branch, and the final step turns the failure into a red job AFTER the report is up.
      - name: Export the Edge Finder app payload
        id: app_export
        if: steps.build.outputs.report_status == 'SUCCESS'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/app_ledger" "$RUNNER_TEMP/app_out"
          git fetch --depth=1 origin handicap-data
          git archive origin/handicap-data data | tar -x -C "$RUNNER_TEMP/app_ledger"
          # last-known-good payload, so a failed export degrades the previous one instead of blanking it
          git fetch --depth=1 origin handicap-reports || true
          if git rev-parse -q --verify origin/handicap-reports:app/latest >/dev/null 2>&1; then
            git archive origin/handicap-reports app/latest | tar -x -C "$RUNNER_TEMP/app_out"
          fi
          HZ=""
          if [ -f /tmp/hz/horizons.json ]; then HZ="--horizon-state /tmp/hz/horizons.json"; fi
          python3 scripts/app_export.py --reports-dir data/handicap_report \
            --handicap-root "$RUNNER_TEMP/app_ledger" --market-data-root /tmp/md $HZ \
            --out "$RUNNER_TEMP/app_out/app/latest" \
            --commit-sha "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID"

      # ---- Edge Finder research explorer (docs/APP_EXPORT.md, "Research explorer") -----------------
      # Same inputs, same app root: written into app/latest/explorer, so the publish below carries it with
      # app/latest. Its own command and its own failure flag: a research failure never blocks the v1 export or
      # the report publish (the v1 payload is already written; publish_explorer leaves no half tree behind).
      - name: Export the Edge Finder research explorer
        id: research_export
        if: steps.app_export.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/research_export.py --reports-dir data/handicap_report \
            --market-data-root /tmp/md --out "$RUNNER_TEMP/app_out/app/latest"

      - name: Publish the browsable latest report
        if: steps.build.outputs.report_status == 'SUCCESS'
        run: |
          # `set -e` is on: a bare `[ -f x ] && Y` that finds no file exits the step, so the test has to
          # be a real if.
          EXTRA=""
          if [ -f /tmp/hz/horizons.json ]; then EXTRA="--horizon-state /tmp/hz/horizons.json"; fi
          if [ -d "$RUNNER_TEMP/app_out/app/latest" ]; then EXTRA="$EXTRA --app-src $RUNNER_TEMP/app_out/app/latest"; fi
          python3 scripts/ci/publish_handicap_report.py --src data/handicap_report $EXTRA \
            --message "run nfl ${{ steps.week.outputs.season }} week ${{ steps.week.outputs.week }} — packet ${{ steps.build.outputs.packet_sha }} ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"

      # The report is published above whatever happened to the export; now the job can be honest about it.
      - name: Fail the job if the app export failed
        if: steps.app_export.outcome == 'failure'
        run: |
          echo "::error::the Edge Finder app export failed; the report was published and app/latest carries a health.json with export_failed=true"
          exit 1

      - name: Fail the job if the research explorer export failed
        if: steps.research_export.outcome == 'failure'
        run: |
          echo "::error::the Edge Finder research explorer export failed; app/latest was published without a fresh explorer/"
          exit 1
