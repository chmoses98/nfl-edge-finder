name: Kalshi NFL tape repair (research-only, read-only API, additive data)

# Recovers PRE-START trade tape beyond the old 10,000-print cap (#246). Publishes ONLY new paths on `market-data`
# (trades_v2/, tape_meta.jsonl, tape_state.json, coverage reports); the published trades/ feed is never rewritten.
# Resumable: tape_state.json keeps per-ticker cursors; exit code 3 = work remains (bounded self-chain).
on:
  workflow_dispatch:
    inputs:
      series:
        description: 'comma list of series tickers'
        required: false
        default: 'KXNFLGAME,KXNFLSPREAD,KXNFLTOTAL,KXNFLTEAMTOTAL'
      budget:
        description: 'HTTP request budget for this run'
        required: false
        default: '20000'
      page_budget:
        description: 'max pages per ticker per run (1000 prints/page)'
        required: false
        default: '200'
      max_tickers:
        description: 'max tickers this run (0 = unlimited within budget)'
        required: false
        default: '0'
      chain:
        description: 'remaining self-dispatches allowed'
        required: false
        default: '3'

permissions:
  contents: write
  actions: write

concurrency:
  group: market-data-backfill
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore markets + tape state from market-data
        run: |
          set -e
          git fetch --depth=1 --filter=blob:none origin +market-data:refs/remotes/origin/market-data
          # one path at a time, only if it exists on the branch: a single missing pathspec (tape_state.json on a first
          # run) makes `git checkout -- a b c` restore NOTHING, which silently turned the first pilot into a no-op.
          for p in markets horizons tape_state.json tape_meta.jsonl trades_v2; do
            if git cat-file -e "origin/market-data:data/kalshi/backfill/$p" 2>/dev/null; then
              git checkout origin/market-data -- "data/kalshi/backfill/$p"
              echo "restored $p"
            else
              echo "not on market-data yet: $p"
            fi
          done
          git reset -q
          test -d data/kalshi/backfill/markets || { echo "::error::markets/ was not restored from market-data"; exit 1; }
          ls data/kalshi/backfill
      - name: Repair tape
        id: repair
        continue-on-error: true
        run: |
          set +e
          python3 scripts/kalshi/tape_repair.py --series "${{ github.event.inputs.series }}" --budget "${{ github.event.inputs.budget }}" --page-budget "${{ github.event.inputs.page_budget }}" --max-tickers "${{ github.event.inputs.max_tickers }}"
          rc=$?
          echo "tape_repair.py exit code: $rc (0=done, 3=work remains, other=ERROR)"
          echo "rc=$rc" >> $GITHUB_OUTPUT
      - name: Coverage report
        if: always()
        run: |
          python3 scripts/kalshi/tape_coverage_report.py --backfill data/kalshi/backfill --out data/kalshi/backfill/tape_coverage.json --md data/kalshi/backfill/tape_coverage.md || true
      - name: Publish (additive paths only)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # publish ONLY what this job produced: drop the restored inputs so nothing else is overlaid on market-data
          rm -rf data/kalshi/backfill/markets data/kalshi/backfill/horizons data/kalshi/backfill/candles data/kalshi/backfill/trades data/kalshi/backfill/state.json
          python3 scripts/ci/publish_market_data.py --src data/kalshi/backfill --sparse --only trades_v2/ --only tape_state.json --only tape_meta.jsonl --only tape_coverage.json --only tape_coverage.md --message "kalshi tape repair $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Fail the job if the repair step errored
        if: always() && steps.repair.outputs.rc != '0' && steps.repair.outputs.rc != '3'
        run: |
          echo "::error::tape_repair.py exit code was '${{ steps.repair.outputs.rc }}' (not 0/3): the repair did not run correctly"
          exit 1
      - name: Chain next run if work remains
        if: steps.repair.outputs.rc == '3' && github.event.inputs.chain != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(( ${{ github.event.inputs.chain }} - 1 ))
          gh workflow run kalshi-tape-repair.yml --ref main -f series="${{ github.event.inputs.series }}" -f budget="${{ github.event.inputs.budget }}" -f page_budget="${{ github.event.inputs.page_budget }}" -f max_tickers="${{ github.event.inputs.max_tickers }}" -f chain="$NEXT"
