name: Tennis Bootstrap (sources + Kalshi tennis discovery)

# The development sandbox cannot reach github.com raw content, tennis-data.co.uk or the Kalshi API.
# This runner can. Two independent jobs fetch raw snapshots and publish them to the orphan
# `tennis-data` branch (never to main / code branches). Read-only public GETs only; no secrets.

on:
  # workflow_dispatch is only registered for workflows on the default branch; a push to the
  # tennis branch that touches the trigger file runs this workflow FROM that branch.
  push:
    branches: ['claude/tennis-edge-finder-nr4scu']
    paths: ['tennis-edge-finder/.bootstrap-trigger']
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Kalshi phase-2 (candles/trades) wall budget in minutes'
        required: false
        default: '200'
      skip_mcp:
        description: 'skip Match Charting Project clone (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire Sackmann snapshots
        id: acquire
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "jobs=kalshi" tennis-edge-finder/.bootstrap-trigger 2>/dev/null; then echo "trigger requests kalshi only; skipping sources"; exit 0; fi
          EXTRA=""
          if [ "${{ github.event.inputs.skip_mcp }}" = "true" ]; then EXTRA="--skip-mcp"; fi
          python3 tennis-edge-finder/scripts/data/bootstrap_sources.py --only sackmann --out tennis-edge-finder/data/sources $EXTRA
      - name: Publish Sackmann snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tennis-edge-finder/scripts/ci/publish_branch.py --branch tennis-data --src tennis-edge-finder/data/sources --message "tennis sources bootstrap (sackmann) $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          rm -rf tennis-edge-finder/data/sources
      - name: Acquire tennis-data.co.uk (+ mirrors)
        id: acquire_td
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if grep -q "jobs=kalshi" tennis-edge-finder/.bootstrap-trigger 2>/dev/null; then exit 0; fi
          sleep 2
          python3 tennis-edge-finder/scripts/data/bootstrap_sources.py --only tennisdata --out tennis-edge-finder/data/sources
      - name: Publish tennis-data snapshots
        run: |
          python3 tennis-edge-finder/scripts/ci/publish_branch.py --branch tennis-data --src tennis-edge-finder/data/sources --message "tennis sources bootstrap (tennis-data + mirrors) $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Report partial acquisition
        if: steps.acquire.outcome != 'success'
        run: echo "::warning::source acquisition reported failures (see manifest.json); data published for inspection"

  kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover Kalshi tennis universe (publishes incrementally)
        id: discover
        continue-on-error: true
        env:
          TENNIS_PUBLISH: "1"
        run: |
          if grep -q "jobs=sources" tennis-edge-finder/.bootstrap-trigger 2>/dev/null; then echo "trigger requests sources only; skipping kalshi"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tennis-edge-finder/scripts/kalshi/discover_tennis.py --budget-minutes "${{ github.event.inputs.budget_minutes || '200' }}"
      - name: Final publish
        run: |
          python3 tennis-edge-finder/scripts/ci/publish_branch.py --branch tennis-data --src tennis-edge-finder/data/kalshi --message "kalshi tennis discovery final publish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Fail if discovery was incomplete
        if: steps.discover.outcome != 'success'
        run: |
          echo "::warning::discovery step exited non-zero (partial universe or error); data was still published"
          exit 1
