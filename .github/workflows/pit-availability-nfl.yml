name: PIT availability capture (NFL, research only)

# Phase 3 prospective, append-only capture of NFL availability sources with OUR retrieval time
# (docs/research/NFL_PIT_AVAILABILITY_CERTIFICATION.md): new nflverse injury-file content (the file has no row time
# from 2025 and is rebuilt in place), a per-snapshot digest of the nflverse depth-chart file (detects rewritten
# history), the ESPN injuries endpoint, and ESPN per-event rosters for games in [T-240m, T+30m] (evidence on an
# official ~T-90m inactive list -- NOT certified, NOT read as availability). Published to data/pit_availability/nfl
# on `market-data`. Nothing here feeds a model, a gate or a production surface.
#
# Cadence (UTC): Wed-Sat four times a day for the practice / final-status reports; hourly on Sunday 11-23 and on
# Monday / Thursday evenings for the ~T-90m window. pull_request: DRY RUN (capture into a scratch store, verify,
# upload the artifact, never publish).

# Scheduling reliability (GitHub drops and delays crons; the 2026-10-12 Monday slots 21:47 / 22:47 never ran and 23:47 ran
# 2h56m late): every primary cron has a BACKUP 12 minutes later, and pit-availability-watchdog.yml dispatches this
# workflow for a dropped slot while its window is open. The "Slot gate" step makes the redundancy idempotent: a run
# whose latest slot already has a PUBLISHED capture is skipped. A late run is never skipped, and nothing is backfilled:
# every capture carries our real retrieval time, and a missed or late slot stays a coverage gap in the health guard.
# 2026-10-28: the crons proved no clock (10-20..28: 36% of capture cron events never created, report-day ones created
# 2.2-5.5 h late, 67% of the watchdog's never created), so the PRIMARY trigger is now pit-availability-clock.yml: a
# self-clocked lane that dispatches this workflow 25 min before each slot with `not_before=<slot>`; the run takes its
# runner early, waits here until the slot, then gates and captures. The crons and the watchdog remain as fallbacks.
# 00:47 UTC Mon/Tue/Fri: the night games kick off ~01:15-01:20 UTC from 2026-11-01, after the 23:47 slot's T-90 list.
on:
  schedule:
    - cron: '17 2,8,14,20 * * 3,4,5,6'
    - cron: '47 11-23 * * 0'
    - cron: '47 21,22,23 * * 1,4'
    - cron: '47 0 * * 1,2,5'
    # backups (+12 min)
    - cron: '29 2,8,14,20 * * 3,4,5,6'
    - cron: '59 11-23 * * 0'
    - cron: '59 21,22,23 * * 1,4'
    - cron: '59 0 * * 1,2,5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'why this was dispatched (the watchdog sets "watchdog:<slot>")'
        required: false
        default: 'manual'
      force:
        description: 'capture even if the latest slot is already covered'
        required: false
        default: 'false'
      not_before:
        description: 'UTC ISO time (the clock sets the slot): wait until then before gating and capturing (max 50 min)'
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/pit-availability-nfl.yml'
      - 'nfl_edge/availability_pit/**'
      - 'scripts/pit_availability/**'
      - 'tests/test_pit_availability.py'

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('PIT availability capture · dispatch · {0}', inputs.reason)
  || github.event_name == 'schedule' && 'PIT availability capture · schedule'
  || format('PIT availability capture · {0}', github.event.pull_request.title) }}

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: pit-availability-nfl-${{ github.event_name == 'pull_request' && github.head_ref || 'capture' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # up to 50 min waiting for a clock dispatch's not_before, then the usual <= 20 min run
    env:
      DRY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      STORE: ${{ github.event_name == 'pull_request' && '/tmp/dry_pit/nfl' || 'data/pit_availability/nfl' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q polars
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Wait for the slot (clock dispatches arrive ~25 min early so the runner queue is absorbed before the slot)
        if: github.event_name == 'workflow_dispatch' && inputs.not_before != ''
        env:
          NOT_BEFORE: ${{ inputs.not_before }}
        run: |
          python3 - <<'PY'
          import os, time
          from datetime import datetime, timezone
          t = datetime.fromisoformat(os.environ["NOT_BEFORE"].replace("Z", "+00:00")).astimezone(timezone.utc)
          left = (t - datetime.now(timezone.utc)).total_seconds()
          if left > 50 * 60:
              raise SystemExit(f"not_before {t.isoformat()} is {left / 60:.0f} min away (max 50): refusing to hold the lane")
          print(f"waiting {max(left, 0) / 60:.1f} min for the slot {t.isoformat()}")
          time.sleep(max(left, 0))
          PY
      - name: Check out the published store (sparse, read-only) and verify it
        run: |
          bash scripts/pit_availability/checkout_store.sh /tmp/pit_md
          python3 scripts/pit_availability/verify_store.py --store /tmp/pit_md/data/pit_availability/nfl
          mkdir -p "$STORE"
          if [ -d /tmp/pit_md/data/pit_availability/nfl ]; then cp -a /tmp/pit_md/data/pit_availability/nfl/. "$STORE"/ ; fi
      - name: Slot gate (skip only a redundant run; fails open)
        id: gate
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python3 scripts/ops/pit_availability_health.py --mode gate --store /tmp/pit_md/data/pit_availability/nfl \
            --event "${{ github.event_name }}" $FORCE --summary "$GITHUB_STEP_SUMMARY" \
            || echo "capture=true" >> "$GITHUB_OUTPUT"
      - name: NFL season being captured
        if: steps.gate.outputs.capture != 'false'
        # The NFL season, not the calendar year: January/February runs (the playoffs) belong to the previous
        # season. Downloading injuries_<calendar year> in January fetched a file that does not exist yet (404,
        # silently) while capture.py looked for the previous season's file, so every playoff run recorded ABSENT.
        run: |
          SEASON=$(python3 -c 'from datetime import datetime, timezone; n = datetime.now(timezone.utc); print(n.year if n.month >= 3 else n.year - 1)')
          echo "SEASON=${SEASON}" >> "$GITHUB_ENV"
          echo "season ${SEASON}"
      - name: Fetch nflverse injuries and depth charts (provenance manifest per file)
        if: steps.gate.outputs.capture != 'false'
        run: |
          python3 scripts/data/nflverse_download.py --only injuries,depth_charts --seasons "${SEASON}-${SEASON}" 2>&1 | tail -2
      - name: Capture
        if: steps.gate.outputs.capture != 'false'
        run: |
          ARGS=""
          if [ "$DRY" = "1" ]; then ARGS="--dry-run"; fi
          python3 scripts/pit_availability/capture.py --store "$STORE" --season "$SEASON" $ARGS | tee /tmp/pit_capture_summary.json
      - name: Verify the local store and that publishing only adds files
        if: steps.gate.outputs.capture != 'false'
        run: |
          python3 scripts/pit_availability/verify_store.py --store "$STORE" --published /tmp/pit_md/data/pit_availability/nfl
      - name: Upload the run as an artifact
        if: always() && steps.gate.outputs.capture != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: pit-availability-nfl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STORE }}
            /tmp/pit_capture_summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish to market-data (append-only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.gate.outputs.capture != 'false'
        run: |
          # --sparse: check out only data/pit_availability of market-data (~52 GB in full); the store only adds files.
          python3 scripts/ci/publish_market_data.py --src data/pit_availability --sparse \
            --message "pit availability nfl $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
