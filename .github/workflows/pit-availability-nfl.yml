name: PIT availability capture (NFL, research only)

# Phase 3 prospective, append-only capture of NFL availability sources with OUR retrieval time
# (docs/research/NFL_PIT_AVAILABILITY_CERTIFICATION.md): new nflverse injury-file content (the file has no row time
# from 2025 and is rebuilt in place), a per-snapshot digest of the nflverse depth-chart file (detects rewritten
# history), the ESPN injuries endpoint, and ESPN per-event rosters for games in [T-240m, T+30m] (evidence on an
# official ~T-90m inactive list -- NOT certified, NOT read as availability). Published to data/pit_availability/nfl
# on `market-data`. Nothing here feeds a model, a gate or a production surface.
#
# Cadence (UTC): Wed-Sat four times a day for the practice / final-status reports; hourly on Sunday 11-23 and on
# Monday / Thursday evenings for the ~T-90m window. pull_request: DRY RUN (capture into a scratch store, verify,
# upload the artifact, never publish).

on:
  schedule:
    - cron: '17 2,8,14,20 * * 3,4,5,6'
    - cron: '47 11-23 * * 0'
    - cron: '47 21,22,23 * * 1,4'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pit-availability-nfl.yml'
      - 'nfl_edge/availability_pit/**'
      - 'scripts/pit_availability/**'
      - 'tests/test_pit_availability.py'

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: pit-availability-nfl-${{ github.event_name == 'pull_request' && github.head_ref || 'capture' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      STORE: ${{ github.event_name == 'pull_request' && '/tmp/dry_pit/nfl' || 'data/pit_availability/nfl' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q polars
      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch nflverse injuries and depth charts (provenance manifest per file)
        run: |
          python3 scripts/data/nflverse_download.py --only injuries,depth_charts --seasons $(date -u +%Y)-$(date -u +%Y) 2>&1 | tail -2
      - name: Check out the published store (sparse, read-only) and verify it
        run: |
          bash scripts/pit_availability/checkout_store.sh /tmp/pit_md
          python3 scripts/pit_availability/verify_store.py --store /tmp/pit_md/data/pit_availability/nfl
          mkdir -p "$STORE"
          if [ -d /tmp/pit_md/data/pit_availability/nfl ]; then cp -a /tmp/pit_md/data/pit_availability/nfl/. "$STORE"/ ; fi
      - name: Capture
        run: |
          ARGS=""
          if [ "$DRY" = "1" ]; then ARGS="--dry-run"; fi
          python3 scripts/pit_availability/capture.py --store "$STORE" $ARGS | tee /tmp/pit_capture_summary.json
      - name: Verify the local store and that publishing only adds files
        run: |
          python3 scripts/pit_availability/verify_store.py --store "$STORE" --published /tmp/pit_md/data/pit_availability/nfl
      - name: Upload the run as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-availability-nfl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STORE }}
            /tmp/pit_capture_summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish to market-data (append-only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/ci/publish_market_data.py --src data/pit_availability \
            --message "pit availability nfl $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
